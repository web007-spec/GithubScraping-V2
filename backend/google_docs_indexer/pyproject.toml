[project]
name = "google-docs-indexer"
version = "1.0.0"
description = "Discover and index publicly accessible Google Docs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "selectolax>=0.3.21",
    "tenacity>=8.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "supabase>=2.4.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "loguru>=0.7.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
    "aiofiles>=23.2.0",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "respx>=0.21.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.2.0",
]

[project.scripts]
google-docs-indexer = "app.cli.main:cli_main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
